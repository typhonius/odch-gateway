[server]
bind_address = "0.0.0.0:3000"
cors_origins = ["http://localhost:5173"]

[hub]
socket_path = "/opt/opendchub/.opendchub/gateway.sock"
secret = "CHANGE_ME_shared_secret"
# Interval in seconds for periodic maintenance (purge stale connections, etc.)
# maintenance_interval_secs = 60

[database]
# PostgreSQL (required — gateway owns the schema, runs migrations on startup)
url = "postgres://odch:password@localhost:5432/odch"

[auth]
api_keys = ["CHANGE_ME_your_secret_api_key"]

[webhook]
max_retries = 3
retry_delay_secs = 5
timeout_secs = 10
max_webhooks = 50

[rate_limit]
# Max requests per minute per API key on write endpoints
requests_per_minute = 10

[greeting]
# Message sent to users on connect. Supports {hub_name} placeholder.
# welcome_message = "Welcome to {hub_name}. Type !help for commands."

[opchat]
# OP group chat relay. Registers a virtual user that relays PMs between ops.
# Remove this section to disable OPChat.
# nick = "OPChat"
# description = "OP Group Chat"

[admin_ui]
# Separate listener for the admin web UI (use nginx to reverse proxy)
bind_address = "127.0.0.1:3001"
username = "admin"
# Generate bcrypt hash: htpasswd -nBC 10 "" | tr -d ':\n'
password_hash = "$2b$10$CHANGE_ME_generate_a_bcrypt_hash"
session_expiry_hours = 8
jwt_secret = "CHANGE_ME_random_secret_at_least_32_chars"
